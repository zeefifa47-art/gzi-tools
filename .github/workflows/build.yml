name: Build GZI TOOLS
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Ekstrak zip
        run: |
          mkdir -p proj
          unzip -q -o gzi-tools.zip -d proj
      - name: Build APK
        working-directory: proj
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Siapkan APK
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/release/app-release.apk out/gzi-tools.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: gzi-tools
          path: out/gzi-tools.apk
