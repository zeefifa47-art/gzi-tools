name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Unzip
        run: |
          mkdir proj
          unzip -q gzi-tools.zip -d proj
      - name: Build
        shell: bash
        working-directory: proj
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log
      - name: Ringkasan error
        if: failure()
        run: |
          echo '### Error build' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E '^e: |error:|What went wrong' -A3 build.log | head -80 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gzi-tools-debug
          path: proj/app/build/outputs/apk/debug/app-debug.apk
